- name: "Sreenath Paleri"
  group: pi
  title: "Assistant Professor · Principal Investigator"
  photo: assets/img/people/sreenath-paleri.jpg
  bio: >-
    Sreenath is an assistant professor in the department of atmospheric sciences at Texas A&M University. Before Texas A&M he was an Environmental Scientist
    at NSF NEON (Battelle) and a postdoc with CIWRO (University of Oklahoma) and NOAA's Atmospheric
    Turbulence and Diffusion Division in Boulder, working on surface energy budgets in complex terrain.
    He did his PhD at UW–Madison, investigating surface-induced secondary circulations using LES and airborne turbulence measurements.
  education:
    - "<b>PhD</b> Atmospheric & Oceanic Sciences, University of Wisconsin–Madison, 2023. Dissertation: Role of heterogeneous ecosystems in modulating surface–atmosphere transport"
    - "<b>BTech</b> Civil Engineering and <b>MTech</b> Applied Mechanics (Fluid Mechanics), IIT Madras, 2013"
  service:
    - "<b>Editorial Board</b> Boundary-Layer Meteorology"
    - "<b>Member</b> AMS Committee on Measurements"
  links:
    email: "paleri@tamu.edu"
    orcid: "https://orcid.org/0000-0003-4435-6343"
    cv: "assets/files/sreenath-paleri-cv.pdf"

